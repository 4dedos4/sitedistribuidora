<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-label="Entregador da JS Distribuidora levando galão de água">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jugBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fd0ff"/>
      <stop offset="100%" stop-color="#0d84e0"/>
    </linearGradient>
    <linearGradient id="shirtOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
  </defs>

  <ellipse cx="160" cy="180" rx="180" ry="150" fill="url(#heroGlow)"/>
  <ellipse cx="164" cy="336" rx="112" ry="14" fill="#000000" opacity="0.28"/>

  <!-- water jug -->
  <g transform="translate(26 168)">
    <path d="M40 6c-13 0-16 10-16 16v6h32v-6c0-6-3-16-16-16Z" fill="none" stroke="#0d84e0" stroke-width="7" stroke-linecap="round"/>
    <rect x="4" y="30" width="72" height="94" rx="20" fill="url(#jugBlue)"/>
    <rect x="22" y="6" width="36" height="26" rx="8" fill="#ffffff"/>
    <rect x="28" y="2" width="24" height="10" rx="4" fill="#e7edf2"/>
    <rect x="14" y="62" width="52" height="30" rx="7" fill="#ffffff" opacity="0.92"/>
    <circle cx="40" cy="77" r="9" fill="#6fd0ff"/>
    <rect x="10" y="38" width="8" height="78" rx="4" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- character (chibi mascot) -->
  <g>
    <!-- back leg -->
    <rect x="141" y="240" width="28" height="56" rx="14" fill="#26324a"/>
    <ellipse cx="155" cy="298" rx="20" ry="10" fill="#111826"/>
    <!-- front leg -->
    <rect x="171" y="240" width="28" height="56" rx="14" fill="#1c2740"/>
    <ellipse cx="185" cy="298" rx="20" ry="10" fill="#0d1420"/>

    <!-- back arm reaching to jug handle -->
    <path d="M132 168c-20 4-34 18-38 34" stroke="#ff8a3d" stroke-width="24" fill="none" stroke-linecap="round"/>
    <circle cx="92" cy="202" r="15" fill="#f4bd91"/>

    <!-- torso -->
    <path d="M112 168c0-22 17-36 44-36s44 14 44 36v58c0 12-10 22-22 22h-44c-12 0-22-10-22-22Z" fill="url(#shirtOrange)"/>
    <path d="M136 134c8 10 24 10 32 0l-8 16h-16Z" fill="#ffffff" opacity="0.9"/>
    <rect x="108" y="192" width="96" height="18" fill="#e85d04"/>
    <circle cx="133" cy="180" r="12" fill="#fff3e4"/>
    <text x="133" y="185" font-family="'Bebas Neue', sans-serif" font-size="13" fill="#ff6a00" text-anchor="middle">JS</text>

    <!-- front arm waving -->
    <path d="M200 170c18 4 30 18 30 36" stroke="#ff6a00" stroke-width="24" fill="none" stroke-linecap="round"/>
    <circle cx="230" cy="204" r="15" fill="#f4bd91"/>

    <!-- head -->
    <circle cx="156" cy="104" r="46" fill="#f4bd91"/>
    <ellipse cx="126" cy="118" rx="9" ry="6" fill="#ff9d7a" opacity="0.6"/>
    <ellipse cx="186" cy="118" rx="9" ry="6" fill="#ff9d7a" opacity="0.6"/>
    <ellipse cx="140" cy="106" rx="5.5" ry="7" fill="#2a2a2a"/>
    <ellipse cx="172" cy="106" rx="5.5" ry="7" fill="#2a2a2a"/>
    <circle cx="142" cy="103" r="1.8" fill="#ffffff"/>
    <circle cx="174" cy="103" r="1.8" fill="#ffffff"/>
    <path d="M138 122c8 10 26 10 34 0" stroke="#a15d34" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- cap -->
    <path d="M110 92a46 46 0 0 1 92 0v4c0 5-4 6-8 4-18-8-58-8-76 0-4 2-8 1-8-4Z" fill="url(#shirtOrange)"/>
    <ellipse cx="156" cy="92" rx="50" ry="9" fill="#e85d04"/>
    <circle cx="156" cy="48" r="6" fill="#ffb547"/>
  </g>

  <!-- delivery box -->
  <g transform="translate(232 190)">
    <rect x="0" y="0" width="70" height="62" rx="10" fill="#ff8a3d"/>
    <rect x="0" y="0" width="70" height="16" rx="8" fill="#ffb547"/>
    <text x="35" y="44" font-family="'Bebas Neue', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">JS</text>
  </g>
</svg>
